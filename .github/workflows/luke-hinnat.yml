name: Hae Luken kantohinnat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selvita:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Selaa Luken tilastotietokantaa
        run: |
          mkdir -p data
          python scripts/luke_hinnat.py data/luke-hinnat.csv
      - name: Tallenna
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/luke-hinnat.csv
          git commit -m "Luke: hintataulukot" || echo "ei muutoksia"
          git push
